<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>StarWatcher - Edge版</title>
    <meta name="description" content="基于 WebAssembly 的星空观测边缘应用" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.50.0/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.50.0/build/stlite.js"></script>
    <script>
      stlite.mount({
        // 1. 在这里添加 skyfield 依赖
        requirements: ["streamlit", "pytz", "skyfield"], 
        // 2. 指定入口文件
        entrypoint: "app.py",
        // 3. 重要：删除了原来的 files: { ... } 模块
        // 这样 stlite 会自动去通过 HTTP 请求获取同目录下的 app.py 文件
      }, document.getElementById("root"));
    </script>
  </body>
</html>
