<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>StarWatcher - Edge版</title>
    <meta name="description" content="基于 WebAssembly 的星空观测边缘应用" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.50.0/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.50.0/build/stlite.js"></script>
    <script>
      stlite.mount({
        requirements: [
            "streamlit", 
            "pytz", 
            "sgp4<2.13",  // 关键！强制使用旧版本，通常是纯Python兼容的
            "skyfield"    // skyfield 会自动用上面已经装好的 sgp4
        ],
        entrypoint: "app.py",
      }, document.getElementById("root"));
    </script>
  </body>
</html>
